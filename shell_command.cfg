[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

[gcode_shell_command gov_perf]
command: sudo /usr/local/bin/cpu-governor performance
timeout: 5.0
verbose: False

[gcode_shell_command gov_ondemand]
command: sudo /usr/local/bin/cpu-governor ondemand
timeout: 5.0
verbose: False

[delayed_gcode gov_reset]
initial_duration: 5.
gcode:
  RUN_SHELL_COMMAND CMD=gov_ondemand