[include fluidd.cfg]
# This file contains pin mappings for the stock 2022 Creality Ender 3
# V3 SE. To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART1 PA2/PA3), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# This also works for the GD32F303 based Creality 4.2.2 board.

# See docs/Config_Reference.md for a description of parameters.
[include macro.cfg]

#[stepper_x]
#step_pin: PC2
#dir_pin: !PB9
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 40
#endstop_pin: ~!PA5
#position_endstop: -6
#position_min: -9
#position_max: 228
#homing_speed: 80

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
#microsteps: 64
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -8
#position_min: -8
#position_max: 230
position_min: -8
position_max: 227
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.70
#run_current: 0.60
#hold_current: 0.5
sense_resistor: 0.150
stealthchop_threshold: 0
#stealthchop_threshold: 999999
interpolate: False
#interpolate: True

#[stepper_y]
#step_pin: PB8
#dir_pin: PB7
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 40
#endstop_pin: ~!PA6
#position_endstop: -14
#position_min: -14
#position_max: 228
#homing_speed: 80

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
#microsteps: 64
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -16
#position_max: 228
position_min: -16
position_max: 227
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.70
#run_current: 0.60
#hold_current: 0.5
sense_resistor: 0.150
#stealthchop_threshold: 999999
stealthchop_threshold: 0
interpolate: False
#interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5
#homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.5
#homing_retract_dist: 2.0

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.150
#stealthchop_threshold: 999999
stealthchop_threshold: 0
interpolate: True

[extruder]
#max_extrude_only_distance: 100.0
max_extrude_cross_section: 5
max_extrude_only_distance: 500
pressure_advance: 0.076
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
#rotation_distance: 7.663
rotation_distance: 8.07
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
# tuned for stock hardware with 200 degree Celsius target
#pid_kp = 21.765
#pid_ki = 1.560
#pid_kd = 75.907
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_kp = 63.991
#pid_ki = 0.736
#pid_kd = 1391.810
# tuned for stock hardware with 70 degree Celsius target
#pid_kp = 63.214
#pid_ki = 0.656
#pid_kd = 1521.878
min_temp: 0
max_temp: 100

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
#max_velocity: 250
max_accel: 3500
#max_accel: 2500
max_z_velocity: 10
#max_z_velocity: 5
square_corner_velocity: 5.0
#max_z_velocity: 100
max_z_accel: 200

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -23.25
y_offset: -17
#x_offset: -23.0
#y_offset: -14.5
#z_offset: 0
#z_offset: 2.65
speed: 5
#speed: 20
samples: 5
samples_result: average
sample_retract_dist: 3.0
samples_tolerance: 0.03
samples_tolerance_retries: 5
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True
lift_speed:20

[safe_z_home]
#home_xy_position: 140,129
#home_xy_position: 140.5,132
home_xy_position: 137.75,131.5
#speed: 150
speed: 100
z_hop: 10
#z_hop_speed: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
#speed: 120
horizontal_move_z: 5
#mesh_min: 30,30         # Need to handle head distance with cr-touch (bl_touch)
mesh_min: 30,30 
#mesh_max: 207,215.5     # Max probe range (230-23,230-14.5)
#mesh_max: 205,213.5     # Max probe range (228-23,228-14.5)
#mesh_max: 207,213.5      # Max probe range (230-23,228-14.5)
mesh_max: 203.75,210      # Max probe range (227-23.25,227-17)
#mesh_max: 200,210
#probe_count: 7,7
#probe_count: 10,10
probe_count: 15,15
algorithm: bicubic
#algorithm: lagrange
bicubic_tension: 0.2
mesh_pps: 7,7

#####################################################################
#   Idle Timeout & Homing
#####################################################################

[idle_timeout]
gcode:
  OFF
timeout: 600

# [display]
# NOT IMPLEMTED (assuming it even works)

[output_pin beeper]
pin: PB0

[screws_tilt_adjust]
#screw1: 53.0, 44.5
#screw1: 54.5, 48.0
screw1: 53.5, 47.5
screw1_name: frente izquierda
screw2: 223, 47.5
screw2_name: frente derecha
screw3: 223, 216.5
#screw3: 227.0, 218.0
screw3_name: atras derecha
screw4: 53.5, 216.5
#screw4: 57.0, 218.0
screw4_name: atras izquierda
horizontal_move_z: 10.
speed: 50.
screw_thread: CCW-M4

#[screws_tilt_adjust]
#screw1: 54.5, 45.5
#screw1_name: front left screw
#screw2: 224.5, 45.5
#screw2_name: front right screw
#screw3: 224.5, 215.5
#screw3_name: rear right screw
#screw4: 54.5, 215.5
#screw4_name: rear left screw
#horizontal_move_z: 10.
#speed: 50.
#screw_thread: CCW-M4

[include prtouch.cfg]
[e3v3se_display]
language: english

[e3v3se_display MACRO1]
gcode: G28
label: Home all
icon: 12

[e3v3se_display MACRO2]
gcode: BED_MESH_CALIBRATE
label: Bed meshing
icon: 29

[gcode_shell_command AUTO_Z_PLA_CMD]
command: bash -lc 'nohup python3 ~/printer_data/config/scripts/auto_z_offset_validate.py --bed 60 --hotend 140 --material pla --bed-soak 900 --runs 5 --max-range 0.05 --retry-sets 2 > ~/printer_data/logs/auto_z_pla.log 2>&1 & disown'
timeout: 10.
verbose: True

[gcode_shell_command AUTO_Z_PETG_CMD]
command: bash -lc 'nohup python3 ~/printer_data/config/scripts/auto_z_offset_validate.py --bed 80 --hotend 161 --material petg --bed-soak 900 --runs 5 --max-range 0.05 --retry-sets 2 > ~/printer_data/logs/auto_z_petg.log 2>&1 & disown'
timeout: 10.
verbose: True

[gcode_shell_command AUTO_Z_TPU_CMD]
command: bash -lc 'nohup python3 ~/printer_data/config/scripts/auto_z_offset_validate.py --bed 60 --hotend 190 --bed-soak 900 --runs 5 --max-range 0.06 --retry-sets 2 > ~/printer_data/logs/auto_z_tpu.log 2>&1 & disown'
timeout: 10.
verbose: True

[gcode_shell_command AUTO_Z_PLA_STATUS_CMD]
command: bash -lc 'tail -n 40 ~/printer_data/logs/auto_z_pla.log 2>/dev/null || echo "Sin log todavia: auto_z_pla.log"'
timeout: 10.
verbose: True

[gcode_shell_command AUTO_Z_PETG_STATUS_CMD]
command: bash -lc 'tail -n 40 ~/printer_data/logs/auto_z_petg.log 2>/dev/null || echo "Sin log todavia: auto_z_petg.log"'
timeout: 10.
verbose: True

[gcode_shell_command AUTO_Z_TPU_STATUS_CMD]
command: bash -lc 'tail -n 40 ~/printer_data/logs/auto_z_tpu.log 2>/dev/null || echo "Sin log todavia: auto_z_tpu.log"'
timeout: 10.
verbose: True

[gcode_shell_command get_mesh_name]
command: bash -lc 'date +"nivelacion_%d-%m-%y_%I%M%p" | tr "[:upper:]" "[:lower:]"'
timeout: 5.0
verbose: True

[gcode_macro AUTO_Z_OFFSET_PLA]
description: Auto Z Offset PLA
gcode:
  RESPOND MSG="Iniciando Auto Z para PLA"
  RUN_SHELL_COMMAND CMD=AUTO_Z_PLA_CMD

[gcode_macro AUTO_Z_OFFSET_PETG]
description: Auto Z Offset PETG
gcode:
  RESPOND MSG="Iniciando Auto Z para PETG"
  RUN_SHELL_COMMAND CMD=AUTO_Z_PETG_CMD

[gcode_macro AUTO_Z_OFFSET_TPU]
description: Auto Z Offset TPU
gcode:
  RESPOND MSG="Iniciando Auto Z para TPU"
  RUN_SHELL_COMMAND CMD=AUTO_Z_TPU_CMD

[gcode_macro AUTO_Z_STATUS_PLA]
description: Muestra el ultimo resultado de Auto Z PLA
gcode:
  RESPOND MSG="Consultando ultimo log Auto Z PLA..."
  RUN_SHELL_COMMAND CMD=AUTO_Z_PLA_STATUS_CMD

[gcode_macro AUTO_Z_STATUS_PETG]
description: Muestra el ultimo resultado de Auto Z PETG
gcode:
  RESPOND MSG="Consultando ultimo log Auto Z PETG..."
  RUN_SHELL_COMMAND CMD=AUTO_Z_PETG_STATUS_CMD

[gcode_macro AUTO_Z_STATUS_TPU]
description: Muestra el ultimo resultado de Auto Z TPU
gcode:
  RESPOND MSG="Consultando ultimo log Auto Z TPU..."
  RUN_SHELL_COMMAND CMD=AUTO_Z_TPU_STATUS_CMD

[gcode_macro MESH60]
description: Calienta cama a 60C, espera 15 min y guarda bed mesh
gcode:
  SET_DISPLAY_TEXT MSG="Obteniendo nombre"
  RUN_SHELL_COMMAND CMD=get_mesh_name
  SET_DISPLAY_TEXT MSG="Bed mesh 60C"
  M140 S60
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=60 MAXIMUM=60.2
  SET_DISPLAY_TEXT MSG="Soak 15 min"
  G4 P900000
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE="nivelacion"
  G28
  SAVE_CONFIG
  SET_DISPLAY_TEXT MSG="Mesh guardado"

[gcode_macro MESH80]
description: Calienta cama a 80C, espera 15 min y guarda bed mesh para PETG
gcode:
  M190 S80
  G4 P900000
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=PETG_80C
  G28
  SAVE_CONFIG

[gcode_macro SCREWSTILT60]
description: Calienta cama a 60C, espera 15 min y hace screws tilt
gcode:
  SET_DISPLAY_TEXT MSG=Screws tilt 60C
  M140 S60
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=60 MAXIMUM=60.2
  SET_DISPLAY_TEXT MSG=Soak 15 min
  G4 P900000
  G28
  SCREWS_TILT_CALCULATE

[e3v3se_display MACRO3]
gcode: AUTO_Z_OFFSET_PLA
label: Auto Z PLA
icon: 20

[e3v3se_display MACRO4]
gcode: AUTO_Z_OFFSET_PETG
label: Auto Z PETG
icon: 20

[e3v3se_display MACRO5]
gcode: AUTO_Z_OFFSET_TPU
label: Auto Z TPU
icon: 20

[e3v3se_display MACRO6]
gcode: MESH60
label: Bed Mesh 60C
icon: 20

[e3v3se_display MACRO7]
gcode: SCREWSTILT60
label: Screws Tilt 60C
icon: 20

[e3v3se_display MACRO8]
gcode: MESH80
label: Bed Mesh 80C
icon: 20

[e3v3se_display MACRO9]
gcode: AUTO_Z_STATUS_PLA
label: Status Z PLA
icon: 20

[e3v3se_display MACRO10]
gcode: AUTO_Z_STATUS_PETG
label: Status Z PETG
icon: 20

[e3v3se_display MACRO11]
gcode: AUTO_Z_STATUS_TPU
label: Status Z TPU
icon: 20

