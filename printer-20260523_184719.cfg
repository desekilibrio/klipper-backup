[include fluidd.cfg]
# This file contains pin mappings for the stock 2022 Creality Ender 3
# V3 SE. To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART1 PA2/PA3), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# This also works for the GD32F303 based Creality 4.2.2 board.

# See docs/Config_Reference.md for a description of parameters.
[include macro.cfg]

#[stepper_x]
#step_pin: PC2
#dir_pin: !PB9
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 40
#endstop_pin: ~!PA5
#position_endstop: -6
#position_min: -9
#position_max: 228
#homing_speed: 80

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
#microsteps: 64
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -8
#position_min: -8
#position_max: 230
position_min: -8
position_max: 227
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.70
#run_current: 0.60
#hold_current: 0.5
sense_resistor: 0.150
stealthchop_threshold: 0
#stealthchop_threshold: 999999
interpolate: False
#interpolate: True

#[stepper_y]
#step_pin: PB8
#dir_pin: PB7
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 40
#endstop_pin: ~!PA6
#position_endstop: -14
#position_min: -14
#position_max: 228
#homing_speed: 80

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
#microsteps: 64
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -16
#position_max: 228
position_min: -16
position_max: 227
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.70
#run_current: 0.60
#hold_current: 0.5
sense_resistor: 0.150
#stealthchop_threshold: 999999
stealthchop_threshold: 0
interpolate: False
#interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5
#homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.5
#homing_retract_dist: 2.0

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.150
#stealthchop_threshold: 999999
stealthchop_threshold: 0
interpolate: True

[extruder]
#max_extrude_only_distance: 100.0
max_extrude_cross_section: 5
max_extrude_only_distance: 500
pressure_advance: 0.076
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
#rotation_distance: 7.663
rotation_distance: 7.44
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
# tuned for stock hardware with 200 degree Celsius target
#pid_kp = 21.765
#pid_ki = 1.560
#pid_kd = 75.907
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
# tuned for stock hardware with 70 degree Celsius target
#pid_kp = 63.214
#pid_ki = 0.656
#pid_kd = 1521.878
min_temp: 0
max_temp: 100

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
#max_velocity: 250
max_accel: 3500
#max_accel: 2500
max_z_velocity: 10
#max_z_velocity: 5
square_corner_velocity: 5.0
#max_z_velocity: 100
max_z_accel: 200

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -23.25
y_offset: -17
#x_offset: -23.0
#y_offset: -14.5
#z_offset: 0
#z_offset: 2.65
speed: 5
#speed: 20
samples: 5
samples_result: average
sample_retract_dist: 3.0
samples_tolerance: 0.03
samples_tolerance_retries: 5
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True
lift_speed:20

[safe_z_home]
#home_xy_position: 140,129
#home_xy_position: 140.5,132
home_xy_position: 137.75,131.5
#speed: 150
speed: 100
z_hop: 10
#z_hop_speed: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
#speed: 120
horizontal_move_z: 5
#mesh_min: 30,30         # Need to handle head distance with cr-touch (bl_touch)
mesh_min: 30,30 
#mesh_max: 207,215.5     # Max probe range (230-23,230-14.5)
#mesh_max: 205,213.5     # Max probe range (228-23,228-14.5)
#mesh_max: 207,213.5      # Max probe range (230-23,228-14.5)
mesh_max: 203.75,210      # Max probe range (227-23.25,227-17)
#mesh_max: 200,210
#probe_count: 7,7
probe_count: 10,10
algorithm: bicubic
#algorithm: lagrange
bicubic_tension: 0.2
mesh_pps: 10,10

#####################################################################
#   Idle Timeout & Homing
#####################################################################

[idle_timeout]
gcode:
  OFF
timeout: 600

# [display]
# NOT IMPLEMTED (assuming it even works)

[output_pin beeper]
pin: PB0

[screws_tilt_adjust]
#screw1: 53.0, 44.5
#screw1: 54.5, 48.0
screw1: 53.5, 47.5
screw1_name: frente izquierda
screw2: 223, 47.5
screw2_name: frente derecha
screw3: 223, 216.5
#screw3: 227.0, 218.0
screw3_name: atras derecha
screw4: 53.5, 216.5
#screw4: 57.0, 218.0
screw4_name: atras izquierda
horizontal_move_z: 10.
speed: 50.
screw_thread: CCW-M4

#[screws_tilt_adjust]
#screw1: 54.5, 45.5
#screw1_name: front left screw
#screw2: 224.5, 45.5
#screw2_name: front right screw
#screw3: 224.5, 215.5
#screw3_name: rear right screw
#screw4: 54.5, 215.5
#screw4_name: rear left screw
#horizontal_move_z: 10.
#speed: 50.
#screw_thread: CCW-M4

[include prtouch.cfg]
[e3v3se_display]
language: english

[e3v3se_display MACRO1]
gcode: G28
label: Home all
icon: 12

[e3v3se_display MACRO2]
gcode: BED_MESH_CALIBRATE
label: Bed meshing
icon: 29

